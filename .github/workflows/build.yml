name: Build J2ME JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up OpenJDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download MIDP Library
      run: |
        mkdir -p lib
        curl -sL "https://repo1.maven.org/maven2/org/microemu/microemu-midp/2.0.4/microemu-midp-2.0.4.jar" -o lib/midp.jar

    - name: Compile Java Code
      run: |
        mkdir -p bin
        javac -source 1.7 -target 1.7 -cp lib/midp.jar -d bin MiniBrowser.java

    - name: Package JAR
      run: |
        jar cvfm MiniBrowser.jar MANIFEST.MF -C bin .

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MiniBrowser-JAR
        path: MiniBrowser.jar
