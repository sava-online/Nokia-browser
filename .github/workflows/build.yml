name: Build J2ME JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up OpenJDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download MIDP & CLDC Libraries
      run: |
        mkdir -p lib
        curl -sL "https://repo1.maven.org/maven2/org/microemu/microemu-midp/2.0.4/microemu-midp-2.0.4.jar" -o lib/midp20.jar
        curl -sL "https://repo1.maven.org/maven2/org/microemu/microemu-cldc/2.0.4/microemu-cldc-2.0.4.jar" -o lib/cldc11.jar

    - name: Compile Java Code for Old Phones
      run: |
        mkdir -p bin
        javac -source 1.3 -target 1.3 -cp "lib/midp20.jar:lib/cldc11.jar" -d bin MiniBrowser.java

    - name: Generate Manifest and Package JAR
      run: |
        echo "MIDlet-1: Supercash, , MiniBrowser" > MANIFEST.MF
        echo "MIDlet-Name: Supercash" >> MANIFEST.MF
        echo "MIDlet-Vendor: Custom" >> MANIFEST.MF
        echo "MIDlet-Version: 0.1" >> MANIFEST.MF
        echo "MicroEdition-Configuration: CLDC-1.1" >> MANIFEST.MF
        echo "MicroEdition-Profile: MIDP-2.0" >> MANIFEST.MF
        echo "" >> MANIFEST.MF
        jar cvfm Supercash.jar MANIFEST.MF -C bin .

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Supercash-JAR
        path: Supercash.jar
        
